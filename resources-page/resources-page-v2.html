document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Urbanist';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2b85ea0e-1c12-44c6-a208-f378b8a38942\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Urbanist';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"630610c9-a6c3-4ad3-b81f-88b75017746d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Urbanist';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2b85ea0e-1c12-44c6-a208-f378b8a38942\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Urbanist';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"630610c9-a6c3-4ad3-b81f-88b75017746d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Urbanist';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"2b85ea0e-1c12-44c6-a208-f378b8a38942\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* E8 Angels (Live) — Color tokens\n   The live app ships its own token layer under the --e8-* prefix. As of the\n   Aug 28 2026 stylesheet capture (uploads/index.css) every value below is read\n   from that layer rather than sampled from a screenshot; the live token name is\n   named in the comment beside it. Where a pixel sample and a token disagreed,\n   the token won — antialiasing and overlay opacity made several samples read a\n   few points light.\n\n   The layer is themed: the palette lives on\n     :root, :root[data-e8-color-scheme=stonewash]\n   and the type scale on\n     :root, :root[data-e8-type-scheme=blend]\n   so the product already has the switch a guideline-aligned theme would need.\n   Only the stonewash / blend pair is present in the shipped sheet.\n\n   Headline findings:\n   - The page ground is a COOL blue-grey (#EDF2F7 = --e8-color-page), not Bone.\n   - Brand teal #2EC4B6 appears nowhere. The teal ramp bottoms out dark:\n     primary #07312C, link #1F5F52, hover #0F5049, accent-on-dark #89B8AB.\n   - danger / warning / success / info / violet / rose are the unmodified\n     Tailwind default ramps, carried in as --e8-<family>-<step>-rgb.\n   - A five-step red-to-green rating ramp and a LinkedIn blue exist in the\n     product and have no counterpart in the guide.\n\n   The \"Brand-guideline reference\" block below was verified swatch by swatch\n   against the guidelines PDF, §04 Color Palette. The guide's accessibility rule\n   for teal: bright teal #2EC4B6 on dark grounds only; on light grounds use\n   Teal Ink #0D6E62 for small text (WCAG AA). */\n:root {\n  /* ---------- Ink (green-tinted, live) ---------- */\n  --ink-900: #14201E; /* --e8-color-ink */ /* page titles, company names */\n  --ink-850: #1E2B28; /* --e8-neutral-800 */ /* table row names */\n  --ink-700: #45524D; /* --e8-color-ink-secondary */ /* body copy */\n  --ink-750: #2F3D39; /* sampled, referral-submitted.png */ /* body copy and\n                         label ink on the referral flow — darker than\n                         --ink-secondary and not present in index.css; the\n                         route appears to carry its own secondary ink. */\n  --ink-600: #66746E; /* --e8-color-ink-muted */ /* meta, secondary */\n  --ink-400: #93A09A; /* --e8-color-ink-faint */ /* placeholder, disabled tab */\n\n  /* ---------- Neutral surfaces & lines (live) ---------- */\n  --white:        #FFFFFF;\n  --paper-50:     #FAFBFA; /* card hover */\n  --paper-100:    #F7F8F6; /* --e8-color-surface-muted */ /* input fill, table head, inset panel */\n  --paper-200:    #EEF1EE; /* --e8-color-surface-subtle */\n  --paper-300:    #E7EAE6; /* --e8-color-surface-strong */ /* zebra row, soft fill */\n  --line-100:     #EEF1EE; /* hairline inside cards */\n  --line-200:     #DFE4E0; /* --e8-color-border */ /* default card / table border */\n  --line-300:     #C2CBC6; /* --e8-color-border-strong */ /* input border, stronger rule */\n\n  /* ---------- Page ground (live) ----------\n     DEVIATION: cool blue-grey. Brand ground is Bone #F0EDE8. */\n  --ground-100:   #EDF2F7; /* --e8-color-page */\n  --ground-200:   #E8EDF2; /* scrim / deeper region */\n  --scrim:        rgb(20 32 30 / 48%); /* --e8-color-overlay */\n\n  /* ---------- Teal (live usage) ---------- */\n  --teal-link:    #1F5F52; /* --e8-color-link */\n  --teal-link-alt:#167168; /* sampled, referral-submitted.png */ /* a fifth\n                     teal: the referral flow's link colour, brighter than\n                     --e8-color-link and closest of the five to the guide's\n                     Teal Ink #0D6E62. See deviation 4. */\n  --teal-deep:    #0F5049; /* --e8-color-primary-hover / --e8-color-link-hover */\n  --teal-wash:    #ECF5F2; /* --e8-primary-50 */\n  --teal-accent-on-dark: #89B8AB; /* --e8-color-accent-on-dark = primary-300 */\n  --teal-mid:     #07312C; /* --e8-color-primary — filled CTA. A screenshot\n                              sample read #325E53; the token is the truth. */\n\n  /* ---------- Status: green (live, Tailwind-derived) ----------\n     DEVIATION: not a brand family. */\n  --ok-bg:        #F0FDF4; /* success-50 */\n  --ok-bg-alt:    #F3FDF5;\n  --ok-border:    #BBF7D0; /* success-200 */\n  --ok-border-alt:#C8F6D3;\n  --ok-text:      #15803D; /* --e8-color-success = success-700 */\n\n  /* ---------- Status: amber (derived, not live) ----------\n     DEVIATION: no amber pill exists in the captured CSS. Derived from the\n     live rating-ramp ochre --rate-1 #E4A464 (which the portal used inline\n     for the \"Contingent\" tag) and darkened to a readable pill text. */\n  --warn-bg:      #FDF6EE;\n  --warn-border:  #EFD3B0;\n  --warn-text:    #96591C;\n\n  /* ---------- Status: informational blue (live) ----------\n     DEVIATION: the guide admits no blue. Used for the LinkedIn glyph. */\n  --info-600:     #2D65BC;\n  --info-400:     #628CCD;\n  --info-bg:      #ECF1F6;\n\n  /* ---------- Rating ramp, 0-4 (live) ----------\n     NOT IN THE GUIDE. Screening matrix cell fills. Numerals sit in ink. */\n  --rate-0:       #E46464;\n  --rate-1:       #E4A464;\n  --rate-2:       #E4E465;\n  --rate-3:       #A5D664;\n  --rate-4:       #64C865;\n  --rate-none:    #E7E9E7;\n\n  /* ---------- Rating ramp, INPUT variant (live) ----------\n     The \"Rate <Company>\" dialog fills the selected segment from a fully\n     saturated ramp, NOT the muted matrix ramp above: same hues, s=100%.\n     Steps 2 and 3 are sampled from rate-company-modal.png (#FFFF05,\n     #81E400); 0, 1 and 4 are hue-matched extrapolations at the same\n     construction, pending a capture with those cells selected. */\n  --rate-input-0: #E40000;\n  --rate-input-1: #E47200;\n  --rate-input-2: #FFFF05;\n  --rate-input-3: #81E400;\n  --rate-input-4: #00E400;\n\n  /* ---------- Brand-guideline reference (NOT used by live components) ----\n     Verified against the guidelines PDF §04. Kept so a corrected,\n     guide-aligned theme is a token swap away. */\n  --guide-forest:     #1A2826;\n  --guide-teal:       #2EC4B6;\n  --guide-teal-ink:   #0D6E62;\n  --guide-slate:      #3D4F4A;\n  --guide-sage:       #8BA88E;\n  --guide-bone:       #F0EDE8;\n  --guide-ochre:      #D4964A;\n  --guide-rose:       #BD9189;\n  --guide-terracotta: #C47055;\n  --guide-sand:       #C8B9A0;\n\n  /* ---------- Semantic aliases (what components consume) ---------- */\n  --text-strong:  var(--ink-900);\n  --text-body:    var(--ink-700);\n  --text-muted:   var(--ink-600);\n  --text-faint:   var(--ink-400);\n  --text-link:    var(--teal-link);\n  --text-on-dark: var(--white);\n\n  --surface-page:    var(--ground-100);\n  --surface-card:    var(--white);\n  --surface-inset:   var(--paper-100);\n  --surface-subtle:  var(--paper-200);\n  --surface-inverse: var(--ink-900);\n\n  --border-hairline: var(--line-100);\n  --border-default:  var(--line-200);\n  --border-strong:   var(--line-300);\n\n  --action-fill:      var(--teal-mid);   /* filled CTA */\n  --action-fill-hover:var(--state-action-fill-hover);\n  --action-text:      var(--white);\n  --nav-active-fill:  var(--teal-deep); /* #0F5049 */\n  --nav-active-text:  var(--white);\n  --focus-ring:       var(--state-focus-color); /* see tokens/interaction.css */\n\n  --success:      var(--ok-text);\n  --success-soft: var(--ok-bg);\n  --success-line: var(--ok-border);\n\n  --warning:      var(--warn-text);\n  --warning-soft: var(--warn-bg);\n  --warning-line: var(--warn-border);\n}\n<\u002Fstyle>\n<style>/* E8 Angels (Live) — Typography tokens\n   Read from the live token layer (--e8-text-*, --e8-font-*, --e8-leading-*) in\n   the Aug 28 2026 stylesheet capture, replacing the earlier screenshot\n   measurements. Two findings worth naming:\n\n   1. Cosmica IS self-hosted in production — /fonts/Cosmica-{Regular,Medium,\n      Semibold,Bold}.woff2, weights 400/500/600/700-900 — but it is bound only\n      to --e8-font-display. Body, UI and data text run on the platform system\n      stack, so almost nothing in the portal actually renders in Cosmica.\n      The woff2 files were not supplied to this project, so --font-display\n      falls through to Avenir Next / system here.\n   2. The heading weight token is 600 (--e8-heading-weight); the 700s in the\n      product come from component-level rules (.page-title, .card-company)\n      overriding it. */\n:root {\n  /* Live stacks, verbatim */\n  --font-system:  -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Cosmica\", \"Avenir Next\", sans-serif;\n  --font-mono:    ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\", monospace;\n\n  --font-sans:    var(--font-system); /* --e8-font-body */\n  --font-ui:      var(--font-sans);\n  --font-heading: var(--font-sans);   /* live headings inherit the body stack */\n  --font-body:    var(--font-sans);\n  --font-label:   var(--font-sans);\n  --font-data:    var(--font-sans);   /* .e8-data-table runs the body stack */\n\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* Role weights.\n     --e8-heading-weight is 600; components push page and company titles to 700.\n     DEVIATION either way: the guide specifies headlines Medium 500. */\n  --fw-heading-token: var(--fw-semibold); /* @kind font */ /* live --e8-heading-weight */\n  --fw-headline: var(--fw-bold);          /* @kind font */ /* as components render */\n  --fw-title:    var(--fw-semibold);      /* @kind font */\n  --fw-body:     var(--fw-regular);       /* @kind font */\n  --fw-label:    var(--fw-semibold);      /* @kind font */ /* --e8-data-header-weight */\n\n  /* Live scale, verbatim (--e8-text-*) */\n  --fs-2xs:         11px;\n  --fs-xs:          12px;\n  --fs-data-header: 12px;\n  --fs-data:        13.5px;\n  --fs-sm:          14.5px;\n  --fs-base:        14.5px;\n  --fs-reading:     15px;\n  --fs-lg:          17.835px;\n  --fs-xl:          20px;\n  --fs-2xl:         24px;\n  --fs-3xl:         30px;\n  --fs-4xl:         36px;\n  --fs-5xl:         42px;\n\n  /* Role aliases (what the components consume) */\n  --fs-page:    var(--fs-4xl); /* \"Member Directory\" */\n  --fs-subject: var(--fs-3xl); /* company name in the detail sheet */\n  --fs-h2:      var(--fs-xl);  /* card / section title */\n  --fs-h3:      var(--fs-lg);  /* company name on a pipeline card */\n  --fs-body:    var(--fs-reading);\n\n  /* Live leading (--e8-leading-*) */\n  --lh-ui:      1.4;  /* @kind font */\n  --lh-reading: 1.5;  /* @kind font */\n  --lh-data:    1.3;  /* @kind font */\n  --lh-tight:   1.15; /* @kind font */ /* display headings, measured */\n  --lh-snug:    1.35; /* @kind font */\n  --lh-normal:  var(--lh-reading); /* @kind font */\n  --lh-relaxed: 1.65; /* @kind font */ /* .card-body, .ask-section-body */\n\n  --ls-page:   -0.02em; /* @kind font */\n  --ls-tight:  -0.01em; /* @kind font */\n  --ls-normal: 0;       /* @kind font */\n  --ls-label:  0.09em;  /* @kind font */ /* uppercase eyebrows */\n  --ls-tag:    0.06em;  /* @kind font */ /* pill tags */\n}\n<\u002Fstyle>\n<style>/* E8 Angels (Live) — Spacing, radii, shadows, layout, motion\n   Radii, shadows and motion are read from the live token layer (--e8-radius-*,\n   --e8-shadow-*) in the Aug 28 2026 stylesheet capture. Layout and control\n   heights are still measured from the captures; where a value is odd (37px\n   input, 42px nav pill, 69px header) it is written as measured.\n   Note the live card radius is 10px, not the 12px this system first recorded. */\n:root {\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n\n  --radius-xs:     4px;\n  --radius-sm:     6px;  /* rating cell */\n  --radius-md:     8px;  /* --e8-radius-control: input, button, nav pill */\n  --radius-lg:     10px; /* --e8-radius-card */\n  --radius-xl:     10px; /* card — was 12px by measurement, token says 10px */\n  --radius-2xl:    14px; /* --e8-radius-panel: detail sheet / modal */\n  --radius-pill:   999px;\n  --radius-circle: 50%;\n\n  --border-w: 1px; /* @kind spacing */\n\n  --shadow-none: none;\n  --shadow-xs:   0 1px 2px rgb(20 32 30 / 5%);\n  --shadow-sm:   0 1px 3px rgb(20 32 30 / 8%), 0 1px 2px rgb(20 32 30 / 4%);\n  --shadow-md:   0 8px 24px rgb(20 32 30 / 10%);\n  --shadow-lg:   0 16px 44px rgb(20 32 30 / 16%);\n  --shadow-card-hover: var(--state-card-hover-shadow);\n  --shadow-focus: var(--state-focus-input-ring);\n\n  /* Layout (measured) */\n  --header-h:      69px; /* top nav, white, hairline base */\n  --slack-strip-h: 34px;\n  --container-max: 1440px;\n  --gutter:        24px;\n  --col-gap:       20px;\n  --card-pad:      20px;\n  --card-gap:      20px;\n\n  /* Controls (measured) */\n  --control-h:     37px; /* search input */\n  --nav-pill-h:    42px;\n  --rating-cell-h: 29px;\n  --rating-gap-x:  8px;\n  --rating-gap-y:  4px;\n  --avatar-sm:     26px;\n  --avatar-md:     32px;\n  --logo-tile:     48px;\n\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 150ms; /* @kind other */ /* live .15s, the dominant duration */\n  --dur-base: 200ms; /* @kind other */ /* live .2s, buttons and border-colour */\n}\n<\u002Fstyle>\n<style>/* E8 Angels (Live) — Interaction state tokens\n   VERIFIED. Every value below is read from the live compiled stylesheet\n   (uploads/index.css, captured Aug 28 2026), not inferred from a screenshot.\n   The app ships its own token layer under the --e8-* prefix; the live name is\n   noted beside each value so the two systems can be reconciled by hand.\n\n   One finding is a defect rather than a value: an unscoped\n     *:focus, *:focus-visible { outline: none !important; box-shadow: none !important }\n   sits near the end of the sheet and suppresses EVERY focus indicator in the\n   product — including --e8-color-focus, the input focus ring and the\n   .ask-card:focus-visible outline, all of which are defined and then overridden.\n   The focus tokens below are therefore what the product INTENDS, not what a\n   keyboard user currently sees. See readme.md § BRAND-GUIDELINE DEVIATIONS. */\n:root {\n  /* Filled action — live --e8-color-primary / -hover / -active */\n  --state-action-fill:        #07312C;\n  --state-action-fill-hover:  #0F5049;\n  --state-action-fill-active: #14201E;\n  --state-action-text:        #FFFFFF;\n\n  /* Link — live --e8-color-link / --e8-color-link-hover.\n     Hover also adds text-decoration: underline on most link classes. */\n  --state-link:       #1F5F52;\n  --state-link-hover: #0F5049;\n\n  /* Quiet / secondary controls: hover fills a surface and darkens the border.\n     Live: .mine-btn:hover, .btn-copy-link:hover, .application-btn:hover */\n  --state-quiet-hover-bg:     #F7F8F6; /* --e8-color-surface-muted */\n  --state-quiet-hover-border: #93A09A; /* --e8-color-ink-faint */\n\n  /* Secondary button — live .btn-secondary:hover */\n  --state-secondary-hover-bg: #DFE4E0; /* --e8-color-border */\n\n  /* Rows, menu items, tabs — live .dd-item:hover, .team-dropdown-item:hover */\n  --state-row-hover-bg:  #F7F8F6;\n  --state-item-hover-bg: #EEF1EE; /* --e8-color-surface-subtle */\n\n  /* Card hover — live .ask-card:hover */\n  --state-card-hover-shadow: 0 2px 8px rgb(20 32 30 / 8%), 0 8px 28px rgb(20 32 30 / 7%);\n  --state-card-hover-border: #C2CBC6; /* --e8-color-border-strong */\n\n  /* Focus — INTENDED, globally suppressed in production (see header note).\n     Inputs: border-color -> ink-faint plus a 3px ink wash ring.\n     Cards/tiles: a 2px ink-faint outline at 2px offset. */\n  --state-focus-color:          #1F5F52; /* --e8-color-focus, defined, unused */\n  --state-focus-input-border:   #93A09A;\n  --state-focus-input-ring:     0 0 0 3px rgb(20 32 30 / 5%);\n  --state-focus-outline:        2px solid #93A09A; /* @kind other */\n  --state-focus-outline-offset: 2px;\n\n  /* Disabled — live .btn:disabled / .btn-primary:disabled / toolbar buttons */\n  --state-disabled-fill:    #C2CBC6; /* --e8-color-border-strong */\n  --state-disabled-text:    #66746E; /* --e8-color-ink-muted */\n  --state-disabled-opacity: 0.5; /* @kind other */\n  --state-disabled-cursor:  not-allowed; /* @kind other */\n\n  /* Error — live .error-message block. There is no field-level error style:\n     required fields fall through to the browser native validation bubble\n     (see sources/, \"Refer a Company\"). */\n  --state-error-text:    #DC2626; /* --e8-color-danger  = danger-600 */\n  --state-error-bg:      #FECDD3; /* --color-error-bg   = rose-200 */\n  --state-error-bg-soft: #FEF2F2; /* --color-error-bg-soft = danger-50 */\n  --state-error-border:  #FECACA; /* --e8-color-danger-border = danger-200 */\n  --state-error-pad:     12px 16px;\n  --state-error-radius:  6px;\n\n  /* Motion — measured across the sheet. .12-.15s dominates for fills and\n     backgrounds, .2s for buttons and border-colour; the easing is the CSS\n     default in nearly every rule. */\n  --state-dur-quick: 130ms; /* @kind other */\n  --state-dur-fast:  150ms; /* @kind other */\n  --state-dur-base:  200ms; /* @kind other */\n  --state-ease:      ease; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* E8 Angels (Live) — base resets and shared primitives */\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--surface-page);\n  color: var(--text-body);\n  font-family: var(--font-body);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 { margin: 0; color: var(--text-strong); font-family: var(--font-heading); line-height: var(--lh-tight); }\np { margin: 0; }\n\na { color: var(--text-link); text-decoration: none; }\na:hover { color: var(--teal-deep); text-decoration: underline; text-underline-offset: 2px; }\n\nbutton { font-family: inherit; }\n:focus-visible { outline: none; box-shadow: var(--shadow-focus); border-radius: var(--radius-md); }\n\n/* Uppercase eyebrow label — used for \"DECARBON8\", \"APPLICATION\", \"FILTER\" */\n.e8-eyebrow {\n  font-size: var(--fs-2xs);\n  font-weight: var(--fw-label);\n  letter-spacing: var(--ls-label);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n/* Page-level card: the portal's one container treatment */\n.e8-card {\n  background: var(--surface-card);\n  border: var(--border-w) solid var(--border-default);\n  border-radius: var(--radius-xl);\n  box-shadow: var(--shadow-sm);\n}\n\n.e8-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.e8-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }\n<\u002Fstyle>\n<style>/* E8 Angels Live Design components style entirely via inline style props\n   referencing CSS custom properties from tokens/*.css — no component\n   classes exist, so there is no compiled component stylesheet here. */\n<\u002Fstyle>\n<style>/* E8 Angels Design System — Live\n   Global entry point. Import this one file.\n   Values are reverse-engineered from the running member portal\n   (app.e8angels.com), not from the brand guidelines. See readme.md\n   § BRAND-GUIDELINE DEVIATIONS for where the two disagree. */\n/* E8 Angels (Live) — Webfonts\n\n   OBSERVED: the running portal renders its UI in a wide geometric grotesk —\n   circular bowls, single-storey 'a', angled-cut 't', short 'r' flag. That is\n   consistent with Cosmica, the primary typeface named in the E8 Brand\n   Guidelines (§03). No Cosmica webfont files were supplied to this project,\n   so it cannot be loaded here.\n\n   FALLBACK: Urbanist — the guide's own approved stand-in wherever Cosmica\n   cannot be embedded. Free on Google Fonts; it is what actually renders in\n   these artifacts today. It is narrower and lighter than the live face, so\n   headline widths here run slightly short of the real app.\n\n   TO ACTIVATE COSMICA: drop the woff2 files into assets/fonts/, add @font-face\n   rules below for weights 300-700, and nothing else changes — \"Cosmica\" is\n   already first in --font-sans. */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d717efc4-0a64-472b-a9f1-adf612a7a3e4\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"0e43bec4-78a6-43a9-9aa8-6286b68acc88\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"cfa5d60b-3f6e-4dec-935f-116f7b7e6e33\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"67c3b192-deea-427e-9167-4757e285b68e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"44a3d111-9b1b-4fb0-8f07-17c979a80e1e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+ present in the shipped sheet.\n\n   Headline findings:\n   - The page ground is a COOL blue-grey (#EDF2F7 = --e8-color-page), not Bone.\n   - Brand teal #2EC4B6 appears nowhere. The teal ramp bottoms out dark:\n     primary #07312C, link #1F5F52, hover #0F5049, accent-on-dark #89B8AB.\n   - danger / warning / success / info / violet / rose are the unmodified\n     Tailwind default ramps, carried in as --e8-<family>-<step>-rgb.\n   - A five-step red-to-green rating ramp and a LinkedIn blue exist in the\n     product and have no counterpart in the guide.\n\n   The \"Brand-guideline reference\" block below was verified swatch by swatch\n   against the guidelines PDF, §04 Color Palette. The guide's accessibility rule\n   for teal: bright teal #2EC4B6 on dark grounds only; on light grounds use\n   Teal Ink #0D6E62 for small text (WCAG AA). */\n:root {\n  /* ---------- Ink (green-tinted, live) ---------- */\n  --ink-900: #14201E; /* --e8-color-ink */ /* page titles, company names */\n  --ink-850: #1E2B28; /* --e8-neutral-800 */ /* table row names */\n  --ink-700: #45524D; /* --e8-color-ink-secondary */ /* body copy */\n  --ink-750: #2F3D39; /* sampled, referral-submitted.png */ /* body copy and\n                         label ink on the referral flow — darker than\n                         --ink-secondary and not present in index.css; the\n                         route appears to carry its own secondary ink. */\n  --ink-600: #66746E; /* --e8-color-ink-muted */ /* meta, secondary */\n  --ink-400: #93A09A; /* --e8-color-ink-faint */ /* placeholder, disabled tab */\n\n  /* ---------- Neutral surfaces & lines (live) ---------- */\n  --white:        #FFFFFF;\n  --paper-50:     #FAFBFA; /* card hover */\n  --paper-100:    #F7F8F6; /* --e8-color-surface-muted */ /* input fill, table head, inset panel */\n  --paper-200:    #EEF1EE; /* --e8-color-surface-subtle */\n  --paper-300:    #E7EAE6; /* --e8-color-surface-strong */ /* zebra row, soft fill */\n  --line-100:     #EEF1EE; /* hairline inside cards */\n  --line-200:     #DFE4E0; /* --e8-color-border */ /* default card / table border */\n  --line-300:     #C2CBC6; /* --e8-color-border-strong */ /* input border, stronger rule */\n\n  /* ---------- Page ground (live) ----------\n     DEVIATION: cool blue-grey. Brand ground is Bone #F0EDE8. */\n  --ground-100:   #EDF2F7; /* --e8-color-page */\n  --ground-200:   #E8EDF2; /* scrim / deeper region */\n  --scrim:        rgb(20 32 30 / 48%); /* --e8-color-overlay */\n\n  /* ---------- Teal (live usage) ---------- */\n  --teal-link:    #1F5F52; /* --e8-color-link */\n  --teal-link-alt:#167168; /* sampled, referral-submitted.png */ /* a fifth\n                     teal: the referral flow's link colour, brighter than\n                     --e8-color-link and closest of the five to the guide's\n                     Teal Ink #0D6E62. See deviation 4. */\n  --teal-deep:    #0F5049; /* --e8-color-primary-hover / --e8-color-link-hover */\n  --teal-wash:    #ECF5F2; /* --e8-primary-50 */\n  --teal-accent-on-dark: #89B8AB; /* --e8-color-accent-on-dark = primary-300 */\n  --teal-mid:     #07312C; /* --e8-color-primary — filled CTA. A screenshot\n                              sample read #325E53; the token is the truth. */\n\n  /* ---------- Status: green (live, Tailwind-derived) ----------\n     DEVIATION: not a brand family. */\n  --ok-bg:        #F0FDF4; /* success-50 */\n  --ok-bg-alt:    #F3FDF5;\n  --ok-border:    #BBF7D0; /* success-200 */\n  --ok-border-alt:#C8F6D3;\n  --ok-text:      #15803D; /* --e8-color-success = success-700 */\n\n  /* ---------- Status: amber (derived, not live) ----------\n     DEVIATION: no amber pill exists in the captured CSS. Derived from the\n     live rating-ramp ochre --rate-1 #E4A464 (which the portal used inline\n     for the \"Contingent\" tag) and darkened to a readable pill text. */\n  --warn-bg:      #FDF6EE;\n  --warn-border:  #EFD3B0;\n  --warn-text:    #96591C;\n\n  /* ---------- Status: informational blue (live) ----------\n     DEVIATION: the guide admits no blue. Used for the LinkedIn glyph. */\n  --info-600:     #2D65BC;\n  --info-400:     #628CCD;\n  --info-bg:      #ECF1F6;\n\n  /* ---------- Rating ramp, 0-4 (live) ----------\n     NOT IN THE GUIDE. Screening matrix cell fills. Numerals sit in ink. */\n  --rate-0:       #E46464;\n  --rate-1:       #E4A464;\n  --rate-2:       #E4E465;\n  --rate-3:       #A5D664;\n  --rate-4:       #64C865;\n  --rate-none:    #E7E9E7;\n\n  /* ---------- Rating ramp, INPUT variant (live) ----------\n     The \"Rate <Company>\" dialog fills the selected segment from a fully\n     saturated ramp, NOT the muted matrix ramp above: same hues, s=100%.\n     Steps 2 and 3 are sampled from rate-company-modal.png (#FFFF05,\n     #81E400); 0, 1 and 4 are hue-matched extrapolations at the same\n     construction, pending a capture with those cells selected. */\n  --rate-input-0: #E40000;\n  --rate-input-1: #E47200;\n  --rate-input-2: #FFFF05;\n  --rate-input-3: #81E400;\n  --rate-input-4: #00E400;\n\n  /* ---------- Brand-guideline reference (NOT used by live components) ----\n     Verified against the guidelines PDF §04. Kept so a corrected,\n     guide-aligned theme is a token swap away. */\n  --guide-forest:     #1A2826;\n  --guide-teal:       #2EC4B6;\n  --guide-teal-ink:   #0D6E62;\n  --guide-slate:      #3D4F4A;\n  --guide-sage:       #8BA88E;\n  --guide-bone:       #F0EDE8;\n  --guide-ochre:      #D4964A;\n  --guide-rose:       #BD9189;\n  --guide-terracotta: #C47055;\n  --guide-sand:       #C8B9A0;\n\n  /* ---------- Semantic aliases (what components consume) ---------- */\n  --text-strong:  var(--ink-900);\n  --text-body:    var(--ink-700);\n  --text-muted:   var(--ink-600);\n  --text-faint:   var(--ink-400);\n  --text-link:    var(--teal-link);\n  --text-on-dark: var(--white);\n\n  --surface-page:    var(--ground-100);\n  --surface-card:    var(--white);\n  --surface-inset:   var(--paper-100);\n  --surface-subtle:  var(--paper-200);\n  --surface-inverse: var(--ink-900);\n\n  --border-hairline: var(--line-100);\n  --border-default:  var(--line-200);\n  --border-strong:   var(--line-300);\n\n  --action-fill:      var(--teal-mid);   /* filled CTA */\n  --action-fill-hover:var(--state-action-fill-hover);\n  --action-text:      var(--white);\n  --nav-active-fill:  var(--teal-deep); /* #0F5049 */\n  --nav-active-text:  var(--white);\n  --focus-ring:       var(--state-focus-color); /* see tokens/interaction.css */\n\n  --success:      var(--ok-text);\n  --success-soft: var(--ok-bg);\n  --success-line: var(--ok-border);\n\n  --warning:      var(--warn-text);\n  --warning-soft: var(--warn-bg);\n  --warning-line: var(--warn-border);\n}\n\n/* E8 Angels (Live) — Typography tokens\n   Read from the live token layer (--e8-text-*, --e8-font-*, --e8-leading-*) in\n   the Aug 28 2026 stylesheet capture, replacing the earlier screenshot\n   measurements. Two findings worth naming:\n\n   1. Cosmica IS self-hosted in production — /fonts/Cosmica-{Regular,Medium,\n      Semibold,Bold}.woff2, weights 400/500/600/700-900 — but it is bound only\n      to --e8-font-display. Body, UI and data text run on the platform system\n      stack, so almost nothing in the portal actually renders in Cosmica.\n      The woff2 files were not supplied to this project, so --font-display\n      falls through to Avenir Next / system here.\n   2. The heading weight token is 600 (--e8-heading-weight); the 700s in the\n      product come from component-level rules (.page-title, .card-company)\n      overriding it. */\n:root {\n  /* Live stacks, verbatim */\n  --font-system:  -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Cosmica\", \"Avenir Next\", sans-serif;\n  --font-mono:    ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\", monospace;\n\n  --font-sans:    var(--font-system); /* --e8-font-body */\n  --font-ui:      var(--font-sans);\n  --font-heading: var(--font-sans);   /* live headings inherit the body stack */\n  --font-body:    var(--font-sans);\n  --font-label:   var(--font-sans);\n  --font-data:    var(--font-sans);   /* .e8-data-table runs the body stack */\n\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* Role weights.\n     --e8-heading-weight is 600; components push page and company titles to 700.\n     DEVIATION either way: the guide specifies headlines Medium 500. */\n  --fw-heading-token: var(--fw-semibold); /* @kind font */ /* live --e8-heading-weight */\n  --fw-headline: var(--fw-bold);          /* @kind font */ /* as components render */\n  --fw-title:    var(--fw-semibold);      /* @kind font */\n  --fw-body:     var(--fw-regular);       /* @kind font */\n  --fw-label:    var(--fw-semibold);      /* @kind font */ /* --e8-data-header-weight */\n\n  /* Live scale, verbatim (--e8-text-*) */\n  --fs-2xs:         11px;\n  --fs-xs:          12px;\n  --fs-data-header: 12px;\n  --fs-data:        13.5px;\n  --fs-sm:          14.5px;\n  --fs-base:        14.5px;\n  --fs-reading:     15px;\n  --fs-lg:          17.835px;\n  --fs-xl:          20px;\n  --fs-2xl:         24px;\n  --fs-3xl:         30px;\n  --fs-4xl:         36px;\n  --fs-5xl:         42px;\n\n  /* Role aliases (what the components consume) */\n  --fs-page:    var(--fs-4xl); /* \"Member Directory\" */\n  --fs-subject: var(--fs-3xl); /* company name in the detail sheet */\n  --fs-h2:      var(--fs-xl);  /* card / section title */\n  --fs-h3:      var(--fs-lg);  /* company name on a pipeline card */\n  --fs-body:    var(--fs-reading);\n\n  /* Live leading (--e8-leading-*) */\n  --lh-ui:      1.4;  /* @kind font */\n  --lh-reading: 1.5;  /* @kind font */\n  --lh-data:    1.3;  /* @kind font */\n  --lh-tight:   1.15; /* @kind font */ /* display headings, measured */\n  --lh-snug:    1.35; /* @kind font */\n  --lh-normal:  var(--lh-reading); /* @kind font */\n  --lh-relaxed: 1.65; /* @kind font */ /* .card-body, .ask-section-body */\n\n  --ls-page:   -0.02em; /* @kind font */\n  --ls-tight:  -0.01em; /* @kind font */\n  --ls-normal: 0;       /* @kind font */\n  --ls-label:  0.09em;  /* @kind font */ /* uppercase eyebrows */\n  --ls-tag:    0.06em;  /* @kind font */ /* pill tags */\n}\n\n/* E8 Angels (Live) — Spacing, radii, shadows, layout, motion\n   Radii, shadows and motion are read from the live token layer (--e8-radius-*,\n   --e8-shadow-*) in the Aug 28 2026 stylesheet capture. Layout and control\n   heights are still measured from the captures; where a value is odd (37px\n   input, 42px nav pill, 69px header) it is written as measured.\n   Note the live card radius is 10px, not the 12px this system first recorded. */\n:root {\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n\n  --radius-xs:     4px;\n  --radius-sm:     6px;  /* rating cell */\n  --radius-md:     8px;  /* --e8-radius-control: input, button, nav pill */\n  --radius-lg:     10px; /* --e8-radius-card */\n  --radius-xl:     10px; /* card — was 12px by measurement, token says 10px */\n  --radius-2xl:    14px; /* --e8-radius-panel: detail sheet / modal */\n  --radius-pill:   999px;\n  --radius-circle: 50%;\n\n  --border-w: 1px; /* @kind spacing */\n\n  --shadow-none: none;\n  --shadow-xs:   0 1px 2px rgb(20 32 30 / 5%);\n  --shadow-sm:   0 1px 3px rgb(20 32 30 / 8%), 0 1px 2px rgb(20 32 30 / 4%);\n  --shadow-md:   0 8px 24px rgb(20 32 30 / 10%);\n  --shadow-lg:   0 16px 44px rgb(20 32 30 / 16%);\n  --shadow-card-hover: var(--state-card-hover-shadow);\n  --shadow-focus: var(--state-focus-input-ring);\n\n  /* Layout (measured) */\n  --header-h:      69px; /* top nav, white, hairline base */\n  --slack-strip-h: 34px;\n  --container-max: 1440px;\n  --gutter:        24px;\n  --col-gap:       20px;\n  --card-pad:      20px;\n  --card-gap:      20px;\n\n  /* Controls (measured) */\n  --control-h:     37px; /* search input */\n  --nav-pill-h:    42px;\n  --rating-cell-h: 29px;\n  --rating-gap-x:  8px;\n  --rating-gap-y:  4px;\n  --avatar-sm:     26px;\n  --avatar-md:     32px;\n  --logo-tile:     48px;\n\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 150ms; /* @kind other */ /* live .15s, the dominant duration */\n  --dur-base: 200ms; /* @kind other */ /* live .2s, buttons and border-colour */\n}\n\n/* E8 Angels (Live) — Interaction state tokens\n   VERIFIED. Every value below is read from the live compiled stylesheet\n   (uploads/index.css, captured Aug 28 2026), not inferred from a screenshot.\n   The app ships its own token layer under the --e8-* prefix; the live name is\n   noted beside each value so the two systems can be reconciled by hand.\n\n   One finding is a defect rather than a value: an unscoped\n     *:focus, *:focus-visible { outline: none !important; box-shadow: none !important }\n   sits near the end of the sheet and suppresses EVERY focus indicator in the\n   product — including --e8-color-focus, the input focus ring and the\n   .ask-card:focus-visible outline, all of which are defined and then overridden.\n   The focus tokens below are therefore what the product INTENDS, not what a\n   keyboard user currently sees. See readme.md § BRAND-GUIDELINE DEVIATIONS. */\n:root {\n  /* Filled action — live --e8-color-primary / -hover / -active */\n  --state-action-fill:        #07312C;\n  --state-action-fill-hover:  #0F5049;\n  --state-action-fill-active: #14201E;\n  --state-action-text:        #FFFFFF;\n\n  /* Link — live --e8-color-link / --e8-color-link-hover.\n     Hover also adds text-decoration: underline on most link classes. */\n  --state-link:       #1F5F52;\n  --state-link-hover: #0F5049;\n\n  /* Quiet / secondary controls: hover fills a surface and darkens the border.\n     Live: .mine-btn:hover, .btn-copy-link:hover, .application-btn:hover */\n  --state-quiet-hover-bg:     #F7F8F6; /* --e8-color-surface-muted */\n  --state-quiet-hover-border: #93A09A; /* --e8-color-ink-faint */\n\n  /* Secondary button — live .btn-secondary:hover */\n  --state-secondary-hover-bg: #DFE4E0; /* --e8-color-border */\n\n  /* Rows, menu items, tabs — live .dd-item:hover, .team-dropdown-item:hover */\n  --state-row-hover-bg:  #F7F8F6;\n  --state-item-hover-bg: #EEF1EE; /* --e8-color-surface-subtle */\n\n  /* Card hover — live .ask-card:hover */\n  --state-card-hover-shadow: 0 2px 8px rgb(20 32 30 / 8%), 0 8px 28px rgb(20 32 30 / 7%);\n  --state-card-hover-border: #C2CBC6; /* --e8-color-border-strong */\n\n  /* Focus — INTENDED, globally suppressed in production (see header note).\n     Inputs: border-color -> ink-faint plus a 3px ink wash ring.\n     Cards/tiles: a 2px ink-faint outline at 2px offset. */\n  --state-focus-color:          #1F5F52; /* --e8-color-focus, defined, unused */\n  --state-focus-input-border:   #93A09A;\n  --state-focus-input-ring:     0 0 0 3px rgb(20 32 30 / 5%);\n  --state-focus-outline:        2px solid #93A09A; /* @kind other */\n  --state-focus-outline-offset: 2px;\n\n  /* Disabled — live .btn:disabled / .btn-primary:disabled / toolbar buttons */\n  --state-disabled-fill:    #C2CBC6; /* --e8-color-border-strong */\n  --state-disabled-text:    #66746E; /* --e8-color-ink-muted */\n  --state-disabled-opacity: 0.5; /* @kind other */\n  --state-disabled-cursor:  not-allowed; /* @kind other */\n\n  /* Error — live .error-message block. There is no field-level error style:\n     required fields fall through to the browser native validation bubble\n     (see sources/, \"Refer a Company\"). */\n  --state-error-text:    #DC2626; /* --e8-color-danger  = danger-600 */\n  --state-error-bg:      #FECDD3; /* --color-error-bg   = rose-200 */\n  --state-error-bg-soft: #FEF2F2; /* --color-error-bg-soft = danger-50 */\n  --state-error-border:  #FECACA; /* --e8-color-danger-border = danger-200 */\n  --state-error-pad:     12px 16px;\n  --state-error-radius:  6px;\n\n  /* Motion — measured across the sheet. .12-.15s dominates for fills and\n     backgrounds, .2s for buttons and border-colour; the easing is the CSS\n     default in nearly every rule. */\n  --state-dur-quick: 130ms; /* @kind other */\n  --state-dur-fast:  150ms; /* @kind other */\n  --state-dur-base:  200ms; /* @kind other */\n  --state-ease:      ease; /* @kind other */\n}\n\n/* E8 Angels (Live) — base resets and shared primitives */\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--surface-page);\n  color: var(--text-body);\n  font-family: var(--font-body);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 { margin: 0; color: var(--text-strong); font-family: var(--font-heading); line-height: var(--lh-tight); }\np { margin: 0; }\n\na { color: var(--text-link); text-decoration: none; }\na:hover { color: var(--teal-deep); text-decoration: underline; text-underline-offset: 2px; }\n\nbutton { font-family: inherit; }\n:focus-visible { outline: none; box-shadow: var(--shadow-focus); border-radius: var(--radius-md); }\n\n/* Uppercase eyebrow label — used for \"DECARBON8\", \"APPLICATION\", \"FILTER\" */\n.e8-eyebrow {\n  font-size: var(--fs-2xs);\n  font-weight: var(--fw-label);\n  letter-spacing: var(--ls-label);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n/* Page-level card: the portal's one container treatment */\n.e8-card {\n  background: var(--surface-card);\n  border: var(--border-w) solid var(--border-default);\n  border-radius: var(--radius-xl);\n  box-shadow: var(--shadow-sm);\n}\n\n.e8-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.e8-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }\n\n\n/* E8 Angels Live Design components style entirely via inline style props\n   referencing CSS custom properties from tokens/*.css — no component\n   classes exist, so there is no compiled component stylesheet here. */\n\n<\u002Fstyle>\n<script src=\"db16145c-467b-424f-ada9-fb067d42f2a4\"><\u002Fscript>\n<script src=\"efe71167-28b0-415a-8460-9a6b5fbe91f0\"><\u002Fscript>\n<script src=\"c729c048-dc0c-4ba3-b367-25df41d29f71\"><\u002Fscript>\n<script src=\"6a5a3c0f-608d-4627-b7fa-71dce95eabfa\"><\u002Fscript>\n<style>\nbody { margin: 0; background: #E4E9EE; }\na { color: var(--text-link); text-decoration: none; }\na:hover { color: var(--teal-deep); text-decoration: underline; }\n.railscroll::-webkit-scrollbar { width: 8px; }\n.railscroll::-webkit-scrollbar-thumb { background: var(--line-300); border-radius: 4px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"padding:36px 40px 6px;font-family:var(--font-sans);max-width:1360px\">\n<div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;color:var(--text-muted);text-transform:uppercase\">E8 Angels member portal<\u002Fdiv>\n<h1 style=\"margin:8px 0 10px;font-size:32px;font-weight:700;color:var(--ink-900);letter-spacing:-0.01em\">Resources — rail and inline viewer<\u002Fh1>\n<p style=\"margin:0;max-width:780px;font-size:15px;line-height:1.6;color:var(--ink-700);text-wrap:pretty\">The left rail never leaves. Picking an item swaps the main panel for the document and keeps you in the portal. Document bodies are prototype placeholders — Google will not render inside this sandbox, so the frame shows the shape and behaviour rather than the file.<\u002Fp>\n<div style=\"margin-top:18px;display:flex;align-items:center;gap:12px;padding:11px 16px;border:1px dashed var(--line-300);border-radius:8px;background:rgba(255,255,255,0.6);width:fit-content\">\n<span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;color:var(--text-muted);text-transform:uppercase\">Preview as<\u002Fspan>\n<div style=\"display:flex;gap:6px\">\n<sc-for list=\"{{ roleChips }}\" as=\"chip\" hint-placeholder-count=\"2\">\n<button sc-camel-on-click=\"{{ chip.onClick }}\" style=\"height:30px;padding:0 12px;border-radius:999px;cursor:pointer;font-family:var(--font-sans);font-size:13px;font-weight:500;border:1px solid {{ chip.border }};background:{{ chip.bg }};color:{{ chip.fg }}\">{{ chip.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"font-size:12px;color:var(--text-faint)\">Prototype control — the live page reads the signed-in role.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<section style=\"padding:22px 40px 72px\">\n<div style=\"width:1440px;border:1px solid var(--line-200);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(20,32,30,0.08);background:var(--surface-page)\">\n<x-import component-from-global-scope=\"E8AngelsDesignSystem_ed2725.TopNav\" items=\"{{ navItems }}\" active=\"links\" logo-src=\"{{ logoSrc }}\" hint-size=\"100%,69px\"><\u002Fx-import>\n\n<div style=\"display:grid;grid-template-columns:332px minmax(0,1fr);grid-template-rows:900px;height:900px\">\n\n<nav class=\"railscroll\" style=\"border-right:1px solid var(--line-200);background:var(--surface-card);overflow-y:auto;min-height:0;padding:20px 0 40px\">\n\n<div style=\"padding:0 18px 16px\">\n<button sc-camel-on-click=\"{{ goHome }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;border-radius:8px;cursor:pointer;text-align:left;font-family:var(--font-sans);background:{{ homeBg }}\">\n<span style=\"display:grid;place-items:center;width:18px;height:18px;color:{{ homeInk }}\">{{ homeIcon }}<\u002Fspan>\n<span style=\"font-size:14px;font-weight:600;color:{{ homeInk }}\">Resources home<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"padding:0 18px 14px\">\n<input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Search resources
