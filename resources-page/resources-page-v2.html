{ docDownload }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line-300);border-radius:8px;background:var(--surface-page);font-size:13px;font-weight:500;color:var(--ink-700);text-decoration:none;white-space:nowrap\" style-hover=\"border-color:var(--teal-mid);color:var(--teal-deep);text-decoration:none\">\n<span style=\"display:grid;place-items:center;width:15px;height:15px\">{{ downloadIcon }}<\u002Fspan>Download<\u002Fa>\n<\u002Fsc-if>\n<sc-if value=\"{{ docHasLink }}\" hint-placeholder-val=\"{{ true }}\">\n<a href=\"{{ docLink }}\" target=\"_blank\" rel=\"noopener\" title=\"Open in a new window\" style=\"display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line-300);border-radius:8px;background:var(--surface-page);color:var(--ink-700);text-decoration:none\" style-hover=\"border-color:var(--teal-mid);color:var(--teal-deep)\">\n<span style=\"display:grid;place-items:center;width:15px;height:15px\">{{ externalIcon }}<\u002Fspan><\u002Fa>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 auto;min-height:0;overflow-y:auto;background:#EDF2F7;padding:26px 0 34px\">\n\n<sc-if value=\"{{ isDocView }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"width:816px;margin:0 auto;background:var(--white);border:1px solid var(--line-200);box-shadow:0 1px 4px rgba(20,32,30,0.08);padding:70px 78px 84px;min-height:760px;box-sizing:border-box\">\n<h1 style=\"margin:0 0 8px;font-family:var(--font-sans);font-size:27px;font-weight:700;line-height:1.25;color:var(--ink-900);text-wrap:pretty\">{{ docTitle }}<\u002Fh1>\n<p style=\"margin:0 0 30px;font-size:13.5px;line-height:1.6;color:var(--ink-600);text-wrap:pretty\">{{ docDesc }}<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:11px\">\n<sc-for list=\"{{ skeleton }}\" as=\"row\" hint-placeholder-count=\"16\">\n<span style=\"display:block;height:{{ row.h }};width:{{ row.w }};border-radius:3px;background:{{ row.bg }};margin-top:{{ row.mt }}\"><\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin:38px 0 0;padding-top:16px;border-top:1px solid var(--line-200);font-family:var(--font-mono);font-size:11px;line-height:1.6;color:var(--text-faint);text-wrap:pretty\">{{ placeholderNote }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDeckView }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"width:900px;margin:0 auto\">\n<div style=\"aspect-ratio:16/9;background:var(--white);border:1px solid var(--line-200);box-shadow:0 1px 4px rgba(20,32,30,0.08);padding:56px 64px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center\">\n<div style=\"font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:var(--teal-deep)\">{{ docSection }}<\u002Fdiv>\n<h1 style=\"margin:12px 0 14px;font-family:var(--font-sans);font-size:34px;font-weight:700;line-height:1.2;color:var(--ink-900);text-wrap:pretty\">{{ docTitle }}<\u002Fh1>\n<div style=\"display:flex;flex-direction:column;gap:10px;max-width:520px\">\n<sc-for list=\"{{ deckLines }}\" as=\"row\" hint-placeholder-count=\"4\">\n<span style=\"display:block;height:{{ row.h }};width:{{ row.w }};border-radius:3px;background:{{ row.bg }}\"><\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:14px\">\n<span style=\"font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted)\">{{ slideLabel }}<\u002Fspan>\n<div style=\"display:flex;gap:8px\">\n<button sc-camel-on-click=\"{{ prevSlide }}\" style=\"height:32px;padding:0 13px;border:1px solid var(--line-300);border-radius:7px;background:var(--white);cursor:pointer;font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:var(--ink-700)\">Previous<\u002Fbutton>\n<button sc-camel-on-click=\"{{ nextSlide }}\" style=\"height:32px;padding:0 13px;border:1px solid var(--line-300);border-radius:7px;background:var(--white);cursor:pointer;font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:var(--ink-700)\">Next<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:16px 0 0;font-family:var(--font-mono);font-size:11px;line-height:1.6;color:var(--text-faint);text-wrap:pretty\">{{ placeholderNote }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isVideoView }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"width:900px;margin:0 auto\">\n<div style=\"position:relative;aspect-ratio:16/9;background:#0B1D1A;border-radius:8px;overflow:hidden\">\n<div style=\"position:absolute;inset:0;display:grid;place-items:center\">\n<span style=\"display:grid;place-items:center;width:66px;height:66px;border-radius:999px;background:rgba(255,255,255,0.92)\">\n<span style=\"width:0;height:0;margin-left:5px;border-left:20px solid var(--teal-deep);border-top:12px solid transparent;border-bottom:12px solid transparent\"><\u002Fspan>\n<\u002Fspan>\n<\u002Fdiv>\n<div style=\"position:absolute;left:0;right:0;bottom:0;padding:14px 18px;display:flex;align-items:center;gap:14px;background:linear-gradient(rgba(11,29,26,0), rgba(11,29,26,0.78))\">\n<span style=\"flex:1 1 auto;height:3px;border-radius:2px;background:rgba(255,255,255,0.28);position:relative;display:block\">\n<span style=\"position:absolute;left:0;top:0;bottom:0;width:22%;border-radius:2px;background:var(--white);display:block\"><\u002Fspan>\n<\u002Fspan>\n<span style=\"font-family:var(--font-mono);font-size:11.5px;color:rgba(255,255,255,0.82);white-space:nowrap\">{{ videoTime }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"position:absolute;top:16px;left:18px;font-family:var(--font-sans);font-size:14px;font-weight:600;color:rgba(255,255,255,0.9)\">{{ docTitle }}<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:16px 0 0;font-family:var(--font-mono);font-size:11px;line-height:1.6;color:var(--text-faint);text-wrap:pretty\">{{ placeholderNote }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isLinkView }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"width:640px;margin:34px auto 0;padding:34px 36px;background:var(--white);border:1px solid var(--line-200);border-radius:12px;box-shadow:0 1px 4px rgba(20,32,30,0.06)\">\n<div style=\"font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-muted)\">Portal page<\u002Fdiv>\n<h2 style=\"margin:8px 0 8px;font-size:22px;font-weight:700;color:var(--ink-900);text-wrap:pretty\">{{ docTitle }}<\u002Fh2>\n<p style=\"margin:0 0 22px;font-size:14px;line-height:1.6;color:var(--ink-700);text-wrap:pretty\">{{ docDesc }}<\u002Fp>\n<a href=\"{{ docLink }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:8px;background:var(--teal-deep);color:var(--white);font-size:14px;font-weight:600;text-decoration:none\" style-hover=\"background:var(--teal-mid);color:var(--white);text-decoration:none\">{{ linkCta }}<\u002Fa>\n<p style=\"margin:20px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);word-break:break-all\">{{ docLink }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1520,&quot;height&quot;:1120}}\">\n/* Glyphs come from the design system's Icon component (Lucide), so the rail matches\n   the top nav instead of approximating it. Names are from the observed portal set. */\nconst ICONS = {\n  doc: 'file-text', deck: 'monitor', video: 'play', link: 'link-2',\n  home: 'home', folder: 'folder', down: 'download', ext: 'external-link',\n  chevD: 'chevron-down', chevR: 'chevron-right'\n};\n\nconst INK = { doc: '#45524D', deck: '#0F5049', video: '#B4441F', link: '#2D65BC' };\n\nfunction svg(key, size) {\n  const DS = window.E8AngelsDesignSystem_ed2725 || {};\n  if (!DS.Icon) return null;\n  return React.createElement(DS.Icon, {\n    name: ICONS[key] || ICONS.doc, size: size || 18, stroke: 1.75, color: 'currentColor'\n  });\n}\n\nclass Component extends DCLogic {\n  state = { ready: false, role: 'members', q: '', tag: 'all', open: 'introduction',\n            sec: null, sel: null, slide: 1 };\n\n  componentDidMount() {\n    const tick = () => {\n      if (window.RES_LIB && window.RES_ROWS) this.setState({ ready: true });\n      else setTimeout(tick, 40);\n    };\n    tick();\n  }\n\n  sections() {\n    if (!window.RES_LIB || !window.RES_ROWS) return [];\n    const role = this.state.role;\n    return window.RES_LIB.build(window.RES_ROWS).map(s => Object.assign({}, s, {\n      /* No link means nothing to open, so the row does not appear at all. */\n      items: s.items.filter(i => i.link && (i.audience === 'all' || i.audience === role))\n    })).filter(s => s.items.length);\n  }\n\n  matches(i) {\n    const q = this.state.q.trim().toLowerCase();\n    if (this.state.tag !== 'all' && i.tag !== this.state.tag) return false;\n    if (q && (i.title + ' ' + i.desc + ' ' + i.tag).toLowerCase().indexOf(q) < 0) return false;\n    return true;\n  }\n\n  select(item) {\n    if (!item.link) return;\n    /* Portal pages are destinations, not documents: the whole screen moves to them\n       rather than embedding them in the panel. */\n    if (item.kind === 'link') { window.location.href = item.link; return; }\n    this.setState({ sel: item.id, sec: null, slide: 1, open: item.sectionId });\n  }\n\n  /* Rail / card row model. `where` tunes the visual weight per surface. */\n  row(item, where) {\n    const active = this.state.sel === item.id;\n    const soon = !item.link;\n    return Object.assign({}, item, {\n      iconEl: svg(soon ? 'doc' : item.kind, where === 'home' ? 20 : 17),\n      iconInk: soon ? 'var(--text-faint)' : INK[item.kind],\n      ink: soon ? 'var(--text-faint)' : (active ? 'var(--teal-deep)' : 'var(--ink-850)'),\n      weight: active ? '600' : '500',\n      bg: active ? 'rgba(15,80,73,0.09)' : 'transparent',\n      spine: active ? 'var(--teal-deep)' : 'var(--line-200)',\n      cursor: soon ? 'default' : 'pointer',\n      soon: soon,\n      soonLabel: soon ? 'Coming soon' : '',\n      rightLabel: soon ? 'Coming soon' : (item.kind === 'link' ? 'Opens portal page' : item.kindLabel),\n      desc: item.desc,\n      onSelect: () => this.select(item)\n    });\n  }\n\n  chip(label, value, key) {\n    const on = this.state[key] === value;\n    return {\n      label: label,\n      weight: on ? '600' : '500',\n      bg: on ? 'var(--ink-900)' : 'transparent',\n      fg: on ? 'var(--white)' : 'var(--ink-700)',\n      border: on ? 'var(--ink-900)' : 'var(--line-300)',\n      onClick: () => {\n        const patch = {}; patch[key] = value; this.setState(patch);\n      }\n    };\n  }\n\n  renderVals() {\n    const secs = this.sections();\n    const flat = [];\n    secs.forEach(s => s.items.forEach(i => flat.push(i)));\n\n    const filtering = this.state.q.trim() !== '' || this.state.tag !== 'all';\n    const tree = secs.map(s => {\n      const items = s.items.filter(i => this.matches(i));\n      return Object.assign({}, s, {\n        items: items.map(i => this.row(i, 'rail')),\n        count: String(items.length),\n        open: filtering ? true : this.state.open === s.id,\n        bg: this.state.sec === s.id ? 'rgba(15,80,73,0.09)'\n          : (this.state.open === s.id && !filtering ? 'rgba(20,32,30,0.05)' : 'transparent'),\n        folderIcon: svg('folder', 16),\n        chevron: svg((filtering || this.state.open === s.id) ? 'chevD' : 'chevR', 14),\n        /* A section header opens the section in the panel as well as expanding it —\n           one click, one place to look. */\n        onToggle: () => this.setState({ open: s.id, sec: s.id, sel: null })\n      });\n    }).filter(s => s.items.length);\n\n    const tags = [];\n    flat.forEach(i => { if (i.tag && tags.indexOf(i.tag) < 0) tags.push(i.tag); });\n\n    /* The pinned block is not a copy of Introduction — the agreement and handbook are\n       already unmissable in the tree, so it carries the two orientation pieces. */\n    const FEATURED = ['New Member Orientation - Nov 2025', 'A Year at E8'];\n    const featured = (secs.filter(s => s.id === 'introduction')[0] || { items: [] })\n      .items.filter(i => FEATURED.indexOf(i.title) >= 0);\n    const recent = flat.filter(i => i.updated).sort((a, b) => (a.updated < b.updated ? 1 : -1)).slice(0, 4);\n\n    const sel = flat.filter(i => i.id === this.state.sel)[0] || null;\n    const kind = sel ? sel.kind : '';\n    /* One filter state drives both surfaces: the panel reads the same filtered\n       section the rail just drew, so the counts can never disagree. */\n    /* Ambassadors: one live portal page for now, not in the sheet yet. When it lands in\n       the admin UI this becomes an ordinary section like the others. */\n    const amb = [{\n      title: 'Ambassador Guide',\n      desc: 'What to cover when you meet an entrepreneur as an E8 ambassador.',\n      iconEl: svg('link', 20),\n      iconInk: INK.link,\n      ink: 'var(--ink-850)',\n      onSelect: () => { window.location.href = 'https://app.e8angels.com/ambassador-guide'; }\n    }];\n\n    const secView = !sel && this.state.sec\n      ? (this.state.sec === 'ambassadors'\n        ? { id: 'ambassadors', title: 'Ambassador guides',\n            blurb: 'Read this to prepare for a founder conversation.', items: amb }\n        : this.state.sec === 'featured'\n        ? { id: 'featured', title: 'New member?',\n            blurb: 'Watch the orientation and see how a year at E8 runs. Your agreement and the member handbook are under Introduction.',\n            items: featured.map(i => this.row(i, 'home')) }\n        : (tree.filter(s => s.id === this.state.sec)[0] || null))\n      : null;\n\n    return {\n      ready: this.state.ready,\n      /* Production nav, verbatim from the portal kit: Resources is not a top-level\n         destination — it sits under the Links menu, which is what stays highlighted. */\n      navItems: [\n        { id: 'home', label: 'Home', icon: 'home' },\n        { id: 'pipeline', label: 'Pipeline', icon: 'git-branch', menu: true },\n        { id: 'members', label: 'Members', icon: 'users', menu: true },\n        { id: 'links', label: 'Links', icon: 'link-2', menu: true }\n      ],\n      logoSrc: (window.__resources && window.__resources.logo) || 'assets/logo.svg',\n      roleChips: [this.chip('Member', 'members', 'role'), this.chip('Fellow', 'fellows', 'role')],\n      tagChips: [this.chip('All', 'all', 'tag')].concat(tags.map(t => this.chip(t, t, 'tag'))),\n\n      query: this.state.q,\n      onQuery: e => this.setState({ q: e.target.value }),\n      clearFilters: () => this.setState({ q: '', tag: 'all' }),\n\n      goHome: () => this.setState({ sel: null, sec: null }),\n      homeBg: (sel || secView) ? 'transparent' : 'rgba(15,80,73,0.09)',\n      homeInk: (sel || secView) ? 'var(--ink-700)' : 'var(--teal-deep)',\n      homeIcon: svg('home', 18),\n\n      ambassadors: amb,\n      ambassadorsRail: amb.map(i => Object.assign({}, i, { iconEl: svg('link', 16) })),\n      openAmbassadors: () => this.setState({ sec: 'ambassadors', sel: null }),\n      ambassadorsBg: this.state.sec === 'ambassadors' && !sel\n        ? 'rgba(15,80,73,0.11)' : 'rgba(15,80,73,0.05)',\n      showFeatured: featured.length > 0,\n      openFeatured: () => this.setState({ sec: 'featured', sel: null }),\n      featuredBg: this.state.sec === 'featured' && !sel ? 'rgba(15,80,73,0.11)' : 'rgba(15,80,73,0.05)',\n      featured: featured.map(i => this.row(i, 'home')),\n      recent: recent.map(i => this.row(i, 'home')),\n\n      tree: tree,\n      treeEmpty: tree.length === 0,\n\n      atHome: !sel && !secView,\n      atSection: !!secView,\n      atDoc: !!sel,\n      secTitle: secView ? secView.title : '',\n      secBlurb: secView ? secView.blurb : '',\n      secCount: secView\n        ? (secView.items.length === 1 ? '1 item' : secView.items.length + ' items') +\n          (filtering && secView.id !== 'featured' && secView.id !== 'ambassadors' ? ' matching' : '')\n        : '',\n      secItems: secView ? secView.items : [],\n      docTitle: sel ? sel.title : '',\n      docDesc: sel ? sel.desc : '',\n      docSection: sel ? sel.sectionTitle : '',\n      docTag: sel ? sel.tag : '',\n      docHasTag: !!(sel && sel.tag),\n      docLink: sel ? sel.link : '',\n      docHasLink: !!(sel && sel.link),\n      docDownload: sel ? sel.download : '',\n      docHasDownload: !!(sel && sel.download),\n      docIcon: svg(kind || 'doc', 20),\n      docIconInk: INK[kind] || 'var(--ink-700)',\n\n      isDocView: kind === 'doc',\n      isDeckView: kind === 'deck',\n      isVideoView: kind === 'video',\n      isLinkView: kind === 'link',\n\n      downloadIcon: svg('down', 15),\n      externalIcon: svg('ext', 15),\n\n      skeleton: [0.98, 0.94, 0.99, 0.62, 0, 0.42, 0.96, 0.99, 0.9, 0.71, 0, 0.38, 0.97, 0.93, 0.98, 0.55]\n        .map(w => (w === 0\n          ? { h: '12px', w: '42%', bg: 'rgba(20,32,30,0.14)', mt: '18px' }\n          : { h: '9px', w: (w * 100).toFixed(0) + '%', bg: 'rgba(20,32,30,0.07)', mt: '0px' })),\n      deckLines: [0.86, 0.7, 0.78, 0.5].map(w =>\n        ({ h: '10px', w: (w * 100).toFixed(0) + '%', bg: 'rgba(20,32,30,0.09)' })),\n\n      slideLabel: 'Slide ' + this.state.slide + ' of 12 — placeholder count',\n      prevSlide: () => this.setState({ slide: Math.max(1, this.state.slide - 1) }),\n      nextSlide: () => this.setState({ slide: Math.min(12, this.state.slide + 1) }),\n      videoTime: '0:00 / --:-- placeholder',\n      linkCta: sel ? 'Go to ' + sel.title : 'Open',\n\n      placeholderNote: 'Prototype placeholder. In the portal this frame renders the real file inline; use the buttons above to download it or open it in a new window.'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
