name: Build manifest.json

on:
  push:
    branches: [main]

jobs:
  build:
    # Skip self-triggered runs (bot-authored commits).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for last-changed-by lookups

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build manifest.json
        run: python .github/scripts/build-manifest.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet manifest.json; then
            echo "manifest.json unchanged; nothing to commit."
          else
            git add manifest.json
            git commit -m "Rebuild manifest.json [skip ci]"
            git push
          fi
