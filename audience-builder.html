<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audience Builder — UX Mockup (In-Context Forms)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Custom scrollbar */
  .audience-scroll::-webkit-scrollbar { width: 6px; }
  .audience-scroll::-webkit-scrollbar-track { background: transparent; }
  .audience-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  .audience-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* Tooltip */
  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute;
    left: 50%;
    bottom: calc(100% + 6px);
    transform: translateX(-50%);
    background: #1e293b;
    color: #f1f5f9;
    font-size: 11px;
    line-height: 1.4;
    padding: 5px 10px;
    border-radius: 6px;
    white-space: normal;
    max-width: 280px;
    z-index: 50;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }

  /* Checkbox styling */
  .cb-label { display: flex; align-items: flex-start; gap: 8px; padding: 5px 12px; cursor: pointer; font-size: 13px; color: #334155; border-radius: 4px; transition: background .1s; }
  .cb-label:hover { background: #f1f5f9; }
  .cb-label input[type="checkbox"] { width: 15px; height: 15px; accent-color: #0f172a; flex-shrink: 0; cursor: pointer; margin-top: 1px; }

  .exclude-mode .cb-label input[type="checkbox"] { accent-color: #e11d48; }
  .exclude-mode .cb-label { color: #9f1239; }

  /* Category header */
  .cat-header { display: flex; align-items: center; justify-content: space-between; padding: 7px 12px; cursor: pointer; user-select: none; }
  .cat-header:hover { background: #f8fafc; }
  .cat-header h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #64748b; }

  /* Chevron rotation */
  .chevron { transition: transform .15s ease; }
  .chevron.collapsed { transform: rotate(-90deg); }

  /* Search */
  .search-box { border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px 10px 6px 32px; font-size: 13px; width: 100%; outline: none; transition: border-color .15s; background: #fff; }
  .search-box:focus { border-color: #94a3b8; box-shadow: 0 0 0 2px rgba(148,163,184,.15); }

  /* Person pill */
  .person-pill { display: inline-flex; align-items: center; gap: 4px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 999px; padding: 2px 8px 2px 10px; font-size: 12px; color: #334155; }
  .person-pill button { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; color: #94a3b8; font-size: 14px; line-height: 1; cursor: pointer; border: none; background: none; }
  .person-pill button:hover { color: #475569; background: #e2e8f0; }
  .person-pill.excluded { background: #fff1f2; border-color: #fecdd3; color: #9f1239; }

  /* Token pill (selected summary) */
  .token-pill { display: inline-flex; align-items: center; gap: 4px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 999px; padding: 3px 6px 3px 10px; font-size: 12px; color: #334155; }
  .token-pill.exclude { background: #fff1f2; border-color: #fecdd3; color: #9f1239; text-decoration: line-through; }
  .token-pill .remove-btn { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; color: #94a3b8; font-size: 14px; line-height: 1; cursor: pointer; border: none; background: none; margin-left: 2px; }
  .token-pill .remove-btn:hover { color: #475569; background: #e2e8f0; }
  .token-pill.exclude .remove-btn:hover { color: #9f1239; background: #fecdd3; }

  /* Quick-select pill */
  .quick-pill { display: inline-flex; align-items: center; padding: 4px 12px; font-size: 12px; font-weight: 500; border-radius: 999px; border: 1px solid #e2e8f0; background: #fff; color: #475569; cursor: pointer; transition: all .12s ease; user-select: none; white-space: nowrap; }
  .quick-pill:hover { background: #f8fafc; border-color: #cbd5e1; }
  .quick-pill.active { background: #0f172a; border-color: #0f172a; color: #fff; }
  .quick-pill.active:hover { background: #1e293b; border-color: #1e293b; }
  .quick-pill .pill-count { opacity: 0.7; margin-left: 1px; }

  /* Resolved list */
  .resolved-row { display: flex; align-items: center; padding: 4px 12px; font-size: 12px; color: #475569; }
  .resolved-row:nth-child(even) { background: #f8fafc; }

  /* Expander link */
  .expander-link { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: #64748b; cursor: pointer; user-select: none; transition: color .12s; }
  .expander-link:hover { color: #334155; }

  /* Form field styling */
  .form-input { border: 1px solid #e2e8f0; border-radius: 6px; padding: 7px 10px; font-size: 13px; width: 100%; outline: none; transition: border-color .15s; background: #fff; color: #334155; }
  .form-input:focus { border-color: #94a3b8; box-shadow: 0 0 0 2px rgba(148,163,184,.15); }
  .form-select { border: 1px solid #e2e8f0; border-radius: 6px; padding: 7px 10px; font-size: 13px; outline: none; transition: border-color .15s; background: #fff; color: #334155; appearance: auto; }
  .form-select:focus { border-color: #94a3b8; box-shadow: 0 0 0 2px rgba(148,163,184,.15); }

  /* Description text ellipsis */
  .desc-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }

  /* Audience expand/collapse */
  .audience-collapsed {
    cursor: pointer;
    padding: 7px 10px;
    font-size: 13px;
    color: #334155;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    min-height: 36px;
    background: #fff;
  }
  .audience-collapsed:hover {
    background: #f8fafc;
  }
  .audience-collapsed .placeholder {
    color: #94a3b8;
  }
  .audience-collapsed .count-label {
    font-size: 12px;
    color: #64748b;
    white-space: nowrap;
  }

  .audience-expandable {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.2s ease, opacity 0.15s ease;
    opacity: 0;
    pointer-events: none;
  }
  .audience-builder-container.is-expanded .audience-expandable {
    max-height: 900px;
    opacity: 1;
    pointer-events: auto;
  }
  .audience-builder-container.is-expanded .audience-collapsed {
    display: none;
  }
  .audience-builder-container.is-expanded {
    box-shadow: 0 0 0 2px rgba(148,163,184,.25), 0 4px 12px rgba(0,0,0,.06);
    border-color: #94a3b8 !important;
  }
</style>

// ── Builder class ────────────────────────────────────────────────────────
class AudienceBuilder {
  constructor(container, context) {
    this.container = container;
    this.context = context;
    this.included = new Set();
    this.excluded = new Set();
    this.includedPeople = [];
    this.excludedPeople = [];
    this.collapsedCats = new Set();
    // All categories collapsed by default in advanced
    for (const cat of CATEGORIES) {
      this.collapsedCats.add(cat.id);
    }
    // First category expanded
    if (CATEGORIES.length > 0) this.collapsedCats.delete(CATEGORIES[0].id);
    this.collapsedCats.add('people');
    this.filterText = '';
    this.showResolved = false;
    this.excludeMode = false;
    this.advancedOpen = false;
    this.expanded = false;
    this.render();
    this._bindClickOutside();
  }

  _bindClickOutside() {
    document.addEventListener('click', (e) => {
      // Close people dropdown when clicking outside it
      const dd = document.getElementById(`people-dropdown-${this.context}`);
      const input = document.getElementById(`people-search-${this.context}`);
      if (dd && input && !dd.contains(e.target) && e.target !== input) {
        dd.classList.add('hidden');
      }
      // Collapse audience builder when clicking outside
      if (this.expanded && !this.container.contains(e.target)) {
        this.collapse();
      }
    });
  }

  expand() {
    if (this.expanded) return;
    this.expanded = true;
    this.container.classList.add('is-expanded');
  }

  collapse() {
    if (!this.expanded) return;
    this.expanded = false;
    this.container.classList.remove('is-expanded');
  }

  getCount() {
    let total = 0;
    for (const itemId of this.included) {
      const item = this.findItem(itemId);
      if (item) total += item.count;
    }
    for (const itemId of this.excluded) {
      const item = this.findItem(itemId);
      if (item) total -= item.count;
    }
    total += this.includedPeople.length;
    total -= this.excludedPeople.length;
    return Math.max(0, total);
  }

  findItem(id) {
    for (const cat of CATEGORIES) {
      for (const item of cat.items) {
        if (item.id === id) return item;
      }
    }
    return null;
  }

  getFrequentPills() {
    return FREQUENT_PILLS[this.context] || FREQUENT_PILLS.meeting;
  }

  isQuickPillActive(pill) {
    return pill.ids.every(id => this.included.has(id));
  }

  toggleQuickPill(pillIndex) {
    const pills = this.getFrequentPills();
    const pill = pills[pillIndex];
    if (this.isQuickPillActive(pill)) {
      pill.ids.forEach(id => this.included.delete(id));
    } else {
      pill.ids.forEach(id => this.included.add(id));
    }
    this.render();
  }

  toggleItem(id) {
    const set = this.excludeMode ? this.excluded : this.included;
    if (set.has(id)) set.delete(id);
    else set.add(id);
    this.render();
  }

  removeIncluded(id) {
    this.included.delete(id);
    this.render();
  }

  removeExcluded(id) {
    this.excluded.delete(id);
    this.render();
  }

  toggleCollapse(catId) {
    if (this.collapsedCats.has(catId)) this.collapsedCats.delete(catId);
    else this.collapsedCats.add(catId);
    this.render();
  }

  matchesFilter(label) {
    if (!this.filterText) return true;
    return label.toLowerCase().includes(this.filterText.toLowerCase());
  }

  addPerson(person) {
    const list = this.excludeMode ? this.excludedPeople : this.includedPeople;
    if (!list.find(p => p.id === person.id)) {
      list.push(person);
      this.render();
    }
  }

  removePerson(personId, fromExcluded) {
    if (fromExcluded) {
      this.excludedPeople = this.excludedPeople.filter(p => p.id !== personId);
    } else {
      this.includedPeople = this.includedPeople.filter(p => p.id !== personId);
    }
    this.render();
  }

  clearAll() {
    this.included.clear();
    this.excluded.clear();
    this.includedPeople = [];
    this.excludedPeople = [];
    this.showResolved = false;
    this.advancedOpen = false;
    this.excludeMode = false;
    this.render();
  }

  toggleAdvanced() {
    this.advancedOpen = !this.advancedOpen;
    this.render();
  }

  toggleExcludeMode() {
    this.excludeMode = !this.excludeMode;
    this.render();
  }

  // ── Render ──
  render() {
    const uid = this.context;
    const count = this.getCount();
    const hasIncluded = this.included.size > 0 || this.includedPeople.length > 0;
    const hasExcluded = this.excluded.size > 0 || this.excludedPeople.length > 0;
    const hasAnything = hasIncluded || hasExcluded;
    const pills = this.getFrequentPills();

    let html = '';

    // ── Collapsed view (always rendered, hidden via CSS when expanded) ──
    html += `<div class="audience-collapsed" onclick="builders['${uid}'].expand()">`;
    if (hasAnything) {
      for (const id of this.included) {
        const item = this.findItem(id);
        if (item) html += `<span class="token-pill">${item.label} <span class="text-slate-400">(${item.count})</span><button class="remove-btn" onclick="event.stopPropagation();builders['${uid}'].removeIncluded('${item.id}')">&times;</button></span>`;
      }
      for (const p of this.includedPeople) {
        html += `<span class="token-pill">${this.escHtml(p.name)}<button class="remove-btn" onclick="event.stopPropagation();builders['${uid}'].removePerson('${p.id}',false)">&times;</button></span>`;
      }
      for (const id of this.excluded) {
        const item = this.findItem(id);
        if (item) html += `<span class="token-pill exclude">NOT ${item.label} <span style="text-decoration:line-through">(${item.count})</span><button class="remove-btn" onclick="event.stopPropagation();builders['${uid}'].removeExcluded('${item.id}')">&times;</button></span>`;
      }
      for (const p of this.excludedPeople) {
        html += `<span class="token-pill exclude">NOT ${this.escHtml(p.name)}<button class="remove-btn" onclick="event.stopPropagation();builders['${uid}'].removePerson('${p.id}',true)">&times;</button></span>`;
      }
      if (count > 0) {
        html += `<span class="count-label">~${count} recipient${count !== 1 ? 's' : ''}</span>`;
      }
    } else {
      html += `<span class="placeholder">Choose audience...</span>`;
    }
    html += `</div>`;

    // ── Expandable content wrapper ──
    html += `<div class="audience-expandable">`;

    // ── Selected pills summary or placeholder (inside expanded view) ──
    html += `<div class="px-3 pt-3 pb-1">`;
    if (hasAnything) {
      html += `<div class="flex flex-wrap gap-1 items-center">`;
      for (const id of this.included) {
        const item = this.findItem(id);
        if (item) html += `<span class="token-pill">${item.label} <span class="text-slate-400">(${item.count})</span><button class="remove-btn" onclick="builders['${uid}'].removeIncluded('${item.id}')">&times;</button></span>`;
      }
      for (const p of this.includedPeople) {
        html += `<span class="token-pill">${this.escHtml(p.name)}<button class="remove-btn" onclick="builders['${uid}'].removePerson('${p.id}',false)">&times;</button></span>`;
      }
      for (const id of this.excluded) {
        const item = this.findItem(id);
        if (item) html += `<span class="token-pill exclude">NOT ${item.label} <span style="text-decoration:line-through">(${item.count})</span><button class="remove-btn" onclick="builders['${uid}'].removeExcluded('${item.id}')">&times;</button></span>`;
      }
      for (const p of this.excludedPeople) {
        html += `<span class="token-pill exclude">NOT ${this.escHtml(p.name)}<button class="remove-btn" onclick="builders['${uid}'].removePerson('${p.id}',true)">&times;</button></span>`;
      }
      html += `</div>`;
    } else {
      html += `<div class="text-sm text-slate-400">Choose audience...</div>`;
    }
    html += `</div>`;

    // ── Frequently used pills ──
    html += `<div class="px-3 pt-2 pb-2">
      <div class="flex items-center gap-2 mb-1.5">
        <span class="text-[10px] font-medium text-slate-400 uppercase tracking-wider">Frequently used</span>
        <span class="text-[10px] text-slate-300 cursor-help" data-tip="Adapts to your usage over time. Shows the audiences you select most often.">&#9432;</span>
      </div>
      <div class="flex flex-wrap gap-1.5">`;
    pills.forEach((pill, i) => {
      const active = this.isQuickPillActive(pill);
      html += `<button class="quick-pill${active ? ' active' : ''}" onclick="builders['${uid}'].toggleQuickPill(${i})">${pill.label} <span class="pill-count">(${pill.count})</span></button>`;
    });
    html += `</div>
    </div>`;

    // ── Recipient count + controls row ──
    html += `<div class="px-3 pb-2">
      <div class="flex items-center gap-3 text-xs">`;
    if (count > 0) {
      html += `<span class="font-medium text-slate-700">~${count} recipient${count !== 1 ? 's' : ''}</span>`;
      html += `<button onclick="builders['${uid}'].showResolved=!builders['${uid}'].showResolved;builders['${uid}'].render()"
        class="text-blue-500 hover:text-blue-700 transition-colors flex items-center gap-0.5">
        <svg class="h-3 w-3 transition-transform ${this.showResolved ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        ${this.showResolved ? 'Hide list' : 'Show list'}
      </button>`;
    } else {
      html += `<span class="text-slate-400">No recipients selected</span>`;
    }
    html += `<span class="flex-1"></span>`;
    // More audiences expander
    html += `<button class="expander-link" onclick="builders['${uid}'].toggleAdvanced()">
      <svg class="h-3 w-3 chevron ${this.advancedOpen ? '' : 'collapsed'}" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      ${this.advancedOpen ? 'Fewer options' : 'More audiences...'}
    </button>`;
    if (hasAnything) {
      html += `<button onclick="builders['${uid}'].clearAll()" class="text-slate-400 hover:text-rose-500 transition-colors ml-1">Clear</button>`;
    }
    html += `</div>`;

    // Resolved list
    if (this.showResolved && count > 0) {
      html += `<div class="mt-2 border border-slate-200 rounded-lg overflow-hidden max-h-[140px] overflow-y-auto audience-scroll">`;
      const showCount = Math.min(count, RESOLVED_LIST.length);
      for (let i = 0; i < showCount; i++) {
        html += `<div class="resolved-row">
          <span class="w-5 text-[10px] text-slate-300 tabular-nums">${i + 1}</span>
          ${RESOLVED_LIST[i]}
        </div>`;
      }
      if (count > showCount) {
        html += `<div class="resolved-row text-slate-400 italic">...and ${count - showCount} more</div>`;
      }
      html += `</div>`;
    }

    html += `</div>`;

    // ── Advanced builder (collapsible) ──
    if (this.advancedOpen) {
      html += `<div class="border-t border-slate-200">`;

      // Search filter + exclude toggle
      html += `<div class="px-3 pt-2 pb-1 flex items-center gap-2">
        <div class="relative flex-1">
          <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 h-3.5 w-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input
            type="text"
            class="search-box"
            placeholder="Search audiences..."
            value="${this.escHtml(this.filterText)}"
            oninput="builders['${uid}'].filterText=this.value;builders['${uid}'].render()"
          />
        </div>
        <button onclick="builders['${uid}'].toggleExcludeMode()"
          class="text-xs px-2 py-1 rounded-md border transition-colors whitespace-nowrap ${this.excludeMode
            ? 'bg-rose-50 border-rose-200 text-rose-600 font-medium'
            : 'border-slate-200 text-slate-400 hover:text-slate-600 hover:border-slate-300'}">
          ${this.excludeMode ? 'Excluding' : 'Exclude...'}
        </button>
      </div>`;

      // Categories list
      const maxH = this.context === 'meeting' ? '300px' : '360px';
      html += `<div class="audience-scroll overflow-y-auto ${this.excludeMode ? 'exclude-mode' : ''}" style="max-height:${maxH}">`;

      let anyVisible = false;
      for (const cat of CATEGORIES) {
        const visibleItems = cat.items.filter(i => this.matchesFilter(i.label) || this.matchesFilter(i.desc || ''));
        if (visibleItems.length === 0) continue;
        anyVisible = true;

        const collapsed = this.collapsedCats.has(cat.id);
        const set = this.excludeMode ? this.excluded : this.included;

        html += `<div class="border-b border-slate-100 last:border-b-0">`;
        html += `<div class="cat-header" onclick="builders['${uid}'].toggleCollapse('${cat.id}')">
          <div class="flex items-center gap-2">
            <svg class="h-3 w-3 text-slate-400 chevron ${collapsed ? 'collapsed' : ''}" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            <h3>${cat.label}</h3>
            <span class="text-[10px] text-slate-300 font-normal">${visibleItems.length}</span>
          </div>
        </div>`;

        if (!collapsed) {
          html += `<div class="pb-1">`;
          for (const item of visibleItems) {
            const checked = set.has(item.id);
            const descHtml = item.desc
              ? `<span class="desc-text text-[11px] text-slate-400 ml-1" title="${this.escHtml(item.desc)}">${this.escHtml(item.desc)}</span>`
              : '';
            html += `<label class="cb-label">
              <input type="checkbox" ${checked ? 'checked' : ''} onchange="builders['${uid}'].toggleItem('${item.id}')" />
              <span class="flex items-baseline gap-1 min-w-0 overflow-hidden">
                <span class="whitespace-nowrap flex-shrink-0">${item.label} <span class="text-slate-400 text-[11px]">(${item.count})</span></span>
                ${descHtml}
              </span>
            </label>`;
          }
          html += `</div>`;
        }
        html += `</div>`;
      }

      // Individual People section
      const peopleMatch = this.matchesFilter('individual') || this.matchesFilter('people') || this.matchesFilter('person') || !this.filterText;
      if (peopleMatch) {
        anyVisible = true;
        const collapsed = this.collapsedCats.has('people');
        const currentPeople = this.excludeMode ? this.excludedPeople : this.includedPeople;
        html += `<div class="border-b border-slate-100">`;
        html += `<div class="cat-header" onclick="builders['${uid}'].toggleCollapse('people')">
          <div class="flex items-center gap-2">
            <svg class="h-3 w-3 text-slate-400 chevron ${collapsed ? 'collapsed' : ''}" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            <h3>Individual People</h3>
          </div>
        </div>`;
        if (!collapsed) {
          html += `<div class="px-3 pb-2">
            <div class="relative mb-2">
              <input
                type="text"
                id="people-search-${uid}"
                class="search-box"
                style="padding-left:10px"
                placeholder="Search by name or email..."
                oninput="builders['${uid}'].showPeopleDropdown(this.value,'${uid}')"
                onfocus="builders['${uid}'].showPeopleDropdown(this.value,'${uid}')"
                autocomplete="off"
              />
              <div id="people-dropdown-${uid}" class="absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg z-10 hidden max-h-[140px] overflow-y-auto"></div>
            </div>`;
          if (currentPeople.length > 0) {
            html += `<div class="flex flex-wrap gap-1">`;
            for (const p of currentPeople) {
              html += `<span class="person-pill ${this.excludeMode ? 'excluded' : ''}">
                ${this.escHtml(p.name)}
                <button onclick="builders['${uid}'].removePerson('${p.id}',${this.excludeMode})">&times;</button>
              </span>`;
            }
            html += `</div>`;
          }
          html += `</div>`;
        }
        html += `</div>`;
      }

      if (!anyVisible) {
        html += `<div class="py-6 text-center text-sm text-slate-400">No audiences match your search.</div>`;
      }

      html += `</div>`; // end scroll area
      html += `</div>`; // end advanced builder
    }

    html += `</div>`; // end audience-expandable

    this.container.innerHTML = html;

    // Re-apply expanded state after re-render
    if (this.expanded) {
      this.container.classList.add('is-expanded');
    } else {
      this.container.classList.remove('is-expanded');
    }

  }

  showPeopleDropdown(query, uid) {
    const dd = document.getElementById(`people-dropdown-${uid}`);
    if (!dd) return;
    const currentList = this.excludeMode ? this.excludedPeople : this.includedPeople;
    const filtered = SAMPLE_PEOPLE.filter(p => {
      if (currentList.find(cp => cp.id === p.id)) return false;
      if (!query) return true;
      const q = query.toLowerCase();
      return p.name.toLowerCase().includes(q) || p.email.toLowerCase().includes(q);
    });
    if (filtered.length === 0) {
      dd.classList.add('hidden');
      return;
    }
    dd.classList.remove('hidden');
    dd.innerHTML = filtered.map(p => `
      <button
        class="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 flex justify-between items-center"
        onmousedown="event.preventDefault();builders['${uid}'].addPerson({id:'${p.id}',name:'${p.name}',email:'${p.email}'});document.getElementById('people-search-${uid}').value=''"
      >
        <span class="text-slate-700">${p.name}</span>
        <span class="text-slate-400 text-xs">${p.email}</span>
      </button>
    `).join('');
  }

  escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
}

// ── Initialize builders ──────────────────────────────────────────────────
const builders = {};
document.querySelectorAll('.audience-builder-container').forEach(el => {
  const ctx = el.dataset.context;
  builders[ctx] = new AudienceBuilder(el, ctx);
});
</script>

</body>
</html>
